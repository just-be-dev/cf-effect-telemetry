[tools]
bun = "1.3.1"

[settings]
experimental = true
pin = true

[hooks]
postinstall = "bun install"

[env]
_.path = "node_modules/.bin"

[tasks.typecheck]
description = "Run TypeScript type checking"
run = "bun run typecheck"

[tasks.prepare]
description = "Patch TypeScript for Effect"
run = "bun run prepare"
