name: Publish Package

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish if version is new
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Required: the runner image ships npm 10.x, below the 11.5.1 floor for
      # trusted publishing (OIDC), and `mise.toml` installs only bun. Node 24
      # bundles npm 11.x; registry-url writes the ~/.npmrc registry entry.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Setup Mise
        uses: jdx/mise-action@v2

      - name: Check
        run: mise run check

      - name: Integration
        run: mise run integration

      - name: Build
        run: mise run build

      - name: Read package version
        id: pkg
        run: mise run package-version

      - name: Check registry
        id: registry
        env:
          PKG_NAME: ${{ steps.pkg.outputs.name }}
          PKG_VERSION: ${{ steps.pkg.outputs.version }}
        run: mise run registry-check

      - name: Publish
        if: steps.registry.outputs.exists == 'false'
        run: mise run publish
